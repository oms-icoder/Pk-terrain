<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PK Terrain</title>
<meta name="description" content="Chaînage GPS des itinéraires et relevé des constats par PK">
<meta name="theme-color" content="#C3161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PK Terrain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne étroite (560 px max). La borne PK est le cœur de l'écran terrain ; les actions sont en grille 2 colonnes, au pouce. */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --sunk:#F4F5F2; --ink:#12171A; --muted:#566065; --line:#D0D6D0;
  --cap:#C3161C; --cap-ink:#FFFFFF; --btn:#12171A; --btn-ink:#FFFFFF;
  --ok:#1C7A4A; --warn:#8F5A0C; --bad:#B42318; --here:#1A5FD0;
  --ok-bg:#E2F1E8; --warn-bg:#FBEFD6; --bad-bg:#FBE4E1; --info-bg:#E4ECF8;
  --shade:rgba(10,12,14,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113; --surface:#181D20; --sunk:#13171A; --ink:#ECEFEC; --muted:#9AA3A6; --line:#2C3438;
    --cap:#D3262C; --cap-ink:#FFFFFF; --btn:#ECEFEC; --btn-ink:#0E1113;
    --ok:#46BA7D; --warn:#E3A845; --bad:#F2695D; --here:#5E99FF;
    --ok-bg:#13281D; --warn-bg:#2E2413; --bad-bg:#341A1A; --info-bg:#172236;
    --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113; --surface:#181D20; --sunk:#13171A; --ink:#ECEFEC; --muted:#9AA3A6; --line:#2C3438;
  --cap:#D3262C; --cap-ink:#FFFFFF; --btn:#ECEFEC; --btn-ink:#0E1113;
  --ok:#46BA7D; --warn:#E3A845; --bad:#F2695D; --here:#5E99FF;
  --ok-bg:#13281D; --warn-bg:#2E2413; --bad-bg:#341A1A; --info-bg:#172236;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--here);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;display:flex;align-items:center;gap:12px;min-width:0}
.top h1,.top h2{margin:0;font:700 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.top h2{font-size:22px;text-transform:none;letter-spacing:0;overflow-wrap:anywhere}
.top .grow{flex:1;min-width:0}
.top .sub{margin:3px 0 0;color:var(--muted);font-size:14px}
.mark{width:22px;height:30px;border-radius:9px 9px 3px 3px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);position:relative;overflow:hidden;flex:none}
.mark::before{content:"";position:absolute;inset:0 0 auto;height:10px;background:var(--cap)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}

/* Boutons */
.btn{appearance:none;border:0;border-radius:12px;min-height:54px;padding:12px 14px;font:600 17px/1.2 var(--f-body);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--cap);color:var(--cap-ink)}
.btn.danger{background:var(--surface);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface)}
.btn svg{width:20px;height:20px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.span2{grid-column:1/-1}

/* Borne */
.borne{background:var(--surface);border-radius:46px 46px 12px 12px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line),0 14px 28px -22px rgba(0,0,0,.55)}
.borne-cap{background:var(--cap);color:var(--cap-ink);padding:16px 22px 11px;text-align:center;font:600 17px/1.15 var(--f-display);letter-spacing:.07em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.borne-body{padding:12px 16px 18px;text-align:center}
.borne-k{font:700 18px/1 var(--f-display);letter-spacing:.32em;color:var(--muted);padding-left:.32em}
.borne-pk{font:700 clamp(66px,23vw,118px)/.95 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.005em}
.borne-sub{margin-top:8px;font-weight:600;color:var(--muted);min-height:1.45em;text-wrap:balance}
.borne-sub.warn{color:var(--warn)}

.status{justify-self:start;display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;padding:9px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status.rec .dot{background:var(--cap);animation:pulse 1.4s ease-in-out infinite}
.status.loc .dot{background:var(--here)}
.status.pause .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.status.rec .dot{animation:none}}

/* Mesures */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5px;background:var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);margin:0;padding:1.5px}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat dt{font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat dd{margin:4px 0 0;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;overflow-wrap:anywhere}
.q{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.q.ok{background:var(--ok)} .q.warn{background:var(--warn)} .q.bad{background:var(--bad)}
@media (min-width:500px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}

.alerts{display:grid;gap:8px}
.alerts:empty{display:none}
.alert{margin:0;border-radius:12px;padding:10px 13px;font-weight:500;font-size:15px;line-height:1.4}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--info-bg);color:var(--ink)}
.note{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

/* Croquis */
.sketch{background:var(--surface);border-radius:var(--radius);box-shadow:inset 0 0 0 1.5px var(--line);padding:6px;display:grid;gap:4px}
.sketch svg{display:block;width:100%;height:auto;max-width:100%}
.sk-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.sk-start{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
.sk-end{fill:var(--ink)}
.sk-obs{fill:var(--warn);stroke:var(--surface);stroke-width:1.5}
.sk-obs.g3{fill:var(--bad)} .sk-obs.g1{fill:var(--ok)}
.sk-borne{fill:var(--cap);stroke:var(--surface);stroke-width:1.5}
.sk-here{fill:var(--here);stroke:var(--surface);stroke-width:2}
.sk-halo{fill:var(--here);opacity:.2}
.sk-scale{stroke:var(--muted);stroke-width:2}
.sk-txt{font:600 11px var(--f-body);fill:var(--muted)}
.sk-empty{margin:0;padding:22px 12px;text-align:center;color:var(--muted);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 8px 6px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg.s{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)} .lg.e{background:var(--ink)} .lg.o{background:var(--warn)} .lg.b{background:var(--cap);border-radius:2px} .lg.h{background:var(--here)}

/* Onglets */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--sunk);padding:4px;border-radius:13px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab{border:0;background:transparent;color:var(--muted);font:600 13.5px/1.1 var(--f-body);padding:11px 1px;border-radius:9px;min-width:0}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14),inset 0 0 0 1px var(--line)}

/* Listes */
.h3{margin:6px 0 0;font:700 15px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rlist{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.rcard{width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--radius);padding:12px 14px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;color:var(--ink)}
.rcard .t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.rcard .m{color:var(--muted);font-size:14px}
.rcard svg{width:18px;height:18px;color:var(--muted)}
.mini{width:50px;border-radius:15px 15px 4px 4px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;background:var(--surface)}
.mini i{display:block;height:11px;background:var(--cap)}
.mini b{display:block;font:700 18px/1 var(--f-display);padding:6px 2px 1px;font-variant-numeric:tabular-nums}
.mini small{display:block;font:600 10px/1 var(--f-body);letter-spacing:.08em;color:var(--muted);padding-bottom:6px;text-transform:uppercase}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:inset 0 0 0 1.5px var(--line);padding:16px;display:grid;gap:12px}
.card h3{margin:0;font:700 20px/1.15 var(--f-display);letter-spacing:.02em}
.card p{margin:0}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font:700 16px var(--f-display)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}

.olist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--radius);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.olist li+li{border-top:1px solid var(--line)}
.orow{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:12px 14px;align-items:start}
.opk{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.opk small{display:block;font:600 13px var(--f-body);color:var(--muted);margin-top:2px}
.otop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.otype{font-weight:700}
.ometa{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.ometa:empty{display:none}
.onote{display:block;font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.pill{display:inline-block;font:600 12px/1 var(--f-body);padding:5px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.summary{display:flex;flex-wrap:wrap;gap:8px}

/* Tableau */
.twrap{overflow-x:auto;background:var(--surface);border-radius:var(--radius);box-shadow:inset 0 0 0 1.5px var(--line);max-height:62vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{position:sticky;top:0;background:var(--sunk);font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td:first-child,th:first-child{text-align:left}
td:first-child{font:700 17px var(--f-display)}
tr.edge td{color:var(--muted)}

/* Choix */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:10px 14px;font:600 15px/1.1 var(--f-body);min-height:44px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);box-shadow:none}
.xlist{display:grid;gap:10px}
.xbtn{width:100%;border:0;text-align:left;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;color:var(--ink)}
.xbtn b{font-size:17px}
.xbtn span{grid-column:1;color:var(--muted);font-size:14px}
.xbtn svg{grid-row:1/3;grid-column:2;width:22px;height:22px;color:var(--muted)}

/* Feuilles */
.backdrop{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.sheet::before{content:"";justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head h2{flex:1;margin:0;font:700 24px/1.1 var(--f-display);text-wrap:balance}
.sh-lead{margin:0;color:var(--muted)}
.sh-lead strong{color:var(--ink);font:700 20px var(--f-display)}
.field{display:grid;gap:7px;min-width:0}
.lbl{font:600 13px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
input[type=text],input[type=number],textarea{font:500 17px/1.3 var(--f-body);color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
textarea{resize:vertical}
.pkin{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--f-display)}
.pkin input{font:700 28px/1 var(--f-display);text-align:center;padding:10px 6px;font-variant-numeric:tabular-nums}
.pkin input:first-of-type{width:4.2em}
.pkin input:last-of-type{width:5em}
.ecart{margin:0;font:700 20px var(--f-display);min-height:1.2em}
.ecart.ok{color:var(--ok)} .ecart.warn{color:var(--warn)} .ecart.bad{color:var(--bad)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--sunk);border-radius:12px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.check input{width:24px;height:24px;margin:0;accent-color:var(--cap)}
.check small{font-weight:400;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;background:var(--btn);color:var(--btn-ink);padding:12px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);width:max-content;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn);color:var(--surface)}
.toast.bad{background:var(--bad);color:var(--surface)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* v2 : corrections après coup */
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;width:auto;flex:none}
.undo{display:flex;align-items:center;gap:12px;background:var(--info-bg);border-radius:12px;padding:8px 8px 8px 14px}
.undo span{flex:1;min-width:0;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.pick svg{cursor:pointer;touch-action:manipulation}
.pick-hint{margin:0;padding:0 8px 6px;color:var(--muted);font-size:13px}
.sk-cut{fill:none;stroke:var(--bad);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.sk-mark{fill:var(--cap);stroke:var(--surface);stroke-width:2.5}
.sk-mark-halo{fill:var(--cap);opacity:.2}
.prev{margin:0;padding:12px 14px 12px 32px;background:var(--sunk);border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;gap:6px;font-size:15px}
.pk2{display:grid;gap:14px}
.hint.warn{color:var(--warn);font-weight:500}
.backdrop{cursor:pointer}
.sheet{cursor:auto}
.toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-btn{border:0;background:transparent;color:inherit;font:700 15px var(--f-body);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;min-height:36px}
/* v3 : organisation, photos, ouvrages */
.loading{margin:0;padding:40px 0;text-align:center;color:var(--muted)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.eyebrow{margin:0 0 3px;font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.top .eyebrow{margin-bottom:4px}
.cmark{width:50px;border-radius:15px 15px 4px 4px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;background:var(--surface)}
.cmark i{display:block;height:11px;background:var(--cap)}
.cmark b{display:block;font:700 17px/1 var(--f-display);padding:8px 2px 9px;letter-spacing:.02em}
.mcard{background:var(--surface);border-radius:var(--radius);box-shadow:inset 0 0 0 1.5px var(--line);padding:14px;display:grid;gap:12px}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mhead h3{margin:0;font:700 20px/1.15 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
.facts.one{grid-template-columns:minmax(0,1fr)}
.facts div{min-width:0}
.facts dt{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sel{user-select:text;-webkit-user-select:text}
.ilist{list-style:none;margin:0;padding:0;background:var(--sunk);border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.ilist li+li{border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:11px 12px}
.irow b{display:block;font-weight:600;overflow-wrap:anywhere}
.irow small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.irow svg{width:18px;height:18px;color:var(--muted)}
.icode{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.rlist li.cls{display:grid;gap:6px}
.clsbar{display:flex;justify-content:flex-end;gap:8px}
.levee{display:grid;gap:16px}
.onote.done{color:var(--ok)}
.sk-obs.done{fill:var(--ok)}

<script>
'use strict';
const APP_VERSION = '3.1';

/*GEO-START*/
const RE = 6371008.8, DEG = Math.PI / 180;
const LAT = 0, LON = 1, PK = 2, ACC = 3, TS = 4;

function hav(a1, o1, a2, o2) {
  const dA = (a2 - a1) * DEG, dO = (o2 - o1) * DEG;
  const s = Math.sin(dA / 2) ** 2 + Math.cos(a1 * DEG) * Math.cos(a2 * DEG) * Math.sin(dO / 2) ** 2;
  return 2 * RE * Math.asin(Math.min(1, Math.sqrt(s)));
}
const segLen = (a, b) => hav(a[LAT], a[LON], b[LAT], b[LON]);
const r1 = v => Math.round(v * 10) / 10;
const hasPos = o => !!o && typeof o.lat === 'number' && Number.isFinite(o.lat) && typeof o.lon === 'number' && Number.isFinite(o.lon);
function pathLenPts(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += segLen(pts[i - 1], pts[i]); return s; }

/* Projette une position sur le tracé : PK, écart à l'axe et côté (sens des PK croissants). */
function project(pts, lat, lon) {
  if (!pts || pts.length < 2) return null;
  const cl = Math.cos(lat * DEG);
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const ax = (a[LON] - lon) * DEG * cl * RE, ay = (a[LAT] - lat) * DEG * RE;
    const bx = (b[LON] - lon) * DEG * cl * RE, by = (b[LAT] - lat) * DEG * RE;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    let t = L2 > 0 ? -(ax * dx + ay * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = ax + t * dx, py = ay + t * dy, d2 = px * px + py * py;
    if (!best || d2 < best.d2 - 1e-9) best = { d2, i, t, cross: dy * ax - dx * ay };
  }
  const a = pts[best.i], b = pts[best.i + 1];
  const last = pts.length - 2;
  return {
    pk: a[PK] + best.t * (b[PK] - a[PK]),
    off: Math.sqrt(best.d2),
    side: best.cross > 0 ? 'G' : 'D',
    i: best.i,
    edge: (best.i === 0 && best.t === 0) ? 'start' : (best.i === last && best.t === 1) ? 'end' : null
  };
}

/* Position sur le tracé d'un PK donné. En cas de recalage en arrière, le dernier passage fait foi. */
function pkToPos(pts, pk) {
  let hit = null;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (!(b[PK] > a[PK])) continue;
    if (pk >= a[PK] - 1e-6 && pk <= b[PK] + 1e-6) {
      const t = Math.max(0, Math.min(1, (pk - a[PK]) / (b[PK] - a[PK])));
      hit = { lat: a[LAT] + t * (b[LAT] - a[LAT]), lon: a[LON] + t * (b[LON] - a[LON]), i, t };
    }
  }
  return hit;
}
function pkBounds(pts) {
  let mn = Infinity, mx = -Infinity;
  for (const p of pts) { if (p[PK] < mn) mn = p[PK]; if (p[PK] > mx) mx = p[PK]; }
  return [mn, mx];
}

/* Points du tracé tous les `step` mètres de PK, interpolés sur les segments. */
function pkTable(pts, step) {
  const out = [];
  if (!pts || pts.length < 2 || !(step > 0)) return out;
  out.push({ pk: pts[0][PK], lat: pts[0][LAT], lon: pts[0][LON], edge: 'Début' });
  let target = Math.floor(pts[0][PK] / step + 1e-9) * step + step;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (b[PK] < a[PK]) {                       // recalage en arrière : la suite du tracé fait foi
      while (out.length > 1 && out[out.length - 1].pk >= b[PK] - 1e-6) out.pop();
      target = Math.max(Math.ceil(b[PK] / step - 1e-9) * step, out[out.length - 1].pk + step * 1e-3);
      continue;
    }
    if (b[PK] === a[PK]) continue;
    while (target <= b[PK] + 1e-6) {
      if (target >= a[PK] - 1e-6) {
        const t = (target - a[PK]) / (b[PK] - a[PK]);
        out.push({ pk: target, lat: a[LAT] + t * (b[LAT] - a[LAT]), lon: a[LON] + t * (b[LON] - a[LON]) });
      }
      target += step;
    }
  }
  const L = pts[pts.length - 1];
  if (Math.abs(out[out.length - 1].pk - L[PK]) > 0.5) out.push({ pk: L[PK], lat: L[LAT], lon: L[LON], edge: 'Fin' });
  else if (out.length > 1) out[out.length - 1].edge = 'Fin';
  return out;
}

/* WGS 84 -> UTM (formules de Snyder). `zone` permet de garder une seule zone pour tout un tableau. */
function toUTM(lat, lon, zone) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const z = zone || Math.min(60, Math.floor((lon + 180) / 6) + 1);
  const lon0 = ((z - 1) * 6 - 180 + 3) * DEG, phi = lat * DEG, lam = lon * DEG;
  const sp = Math.sin(phi), cp = Math.cos(phi), tp = Math.tan(phi);
  const N = a / Math.sqrt(1 - e2 * sp * sp), T = tp * tp, C = ep2 * cp * cp, A = cp * (lam - lon0);
  const e4 = e2 * e2, e6 = e4 * e2;
  const M = a * ((1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * phi
    - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * phi)
    + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * phi)
    - (35 * e6 / 3072) * Math.sin(6 * phi));
  const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  let y = k0 * (M + N * tp * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  if (lat < 0) y += 1e7;
  return { x, y, zone: z, hemi: lat < 0 ? 'S' : 'N' };
}

function fmtPK(m) {
  if (m == null || !isFinite(m)) return '—';
  const neg = m < 0, v = Math.round(Math.abs(m));
  const km = Math.floor(v / 1000), r = v - km * 1000;
  return (neg ? '−' : '') + km + '+' + String(r).padStart(3, '0');
}

/* ----- Corrections du tracé ----- */
/* Un « saut » est un recalage : l'écart de PK ne correspond pas à la distance parcourue. */
const isJump = (a, b) => Math.abs((b[PK] - a[PK]) - segLen(a, b)) > 1;
function interpPt(a, b, t) {
  return [a[LAT] + t * (b[LAT] - a[LAT]), a[LON] + t * (b[LON] - a[LON]), r1(a[PK] + t * (b[PK] - a[PK])), Math.max(a[ACC] || 0, b[ACC] || 0), Math.round((a[TS] || 0) + t * ((b[TS] || 0) - (a[TS] || 0)))];
}
function cutAt(pts, pk) {
  const h = pkToPos(pts, pk); if (!h) return null;
  const p = interpPt(pts[h.i], pts[h.i + 1], h.t); p[PK] = r1(pk);
  return { i: h.i, t: h.t, p };
}
function dedupe(pts) {
  const out = [];
  for (const p of pts) {
    const L = out[out.length - 1];
    if (L && Math.abs(L[PK] - p[PK]) < 0.05 && segLen(L, p) < 0.05) continue;
    out.push(p);
  }
  return out;
}
/* Décale les PK à partir de l'indice `from`, jusqu'au prochain recalage (les PK recalés sur une borne restent justes).
   Renvoie la plage d'anciens PK concernée, pour décaler les constats de la même façon. */
function shiftPts(pts, from, delta) {
  let end = pts.length;
  for (let k = from + 1; k < pts.length; k++) if (isJump(pts[k - 1], pts[k])) { end = k; break; }
  const lo = from < pts.length ? pts[from][PK] : Infinity;
  const hi = end < pts.length ? pts[end - 1][PK] + segLen(pts[end - 1], pts[end]) : Infinity;
  for (let k = from; k < end; k++) pts[k][PK] = r1(pts[k][PK] + delta);
  return { lo, hi };
}
const clone = x => JSON.parse(JSON.stringify(x));

/* Applique une correction sur une copie de l'itinéraire. Ne modifie jamais l'original. */
function trackOp(r0, op, v1, v2) {
  const r = clone(r0), pts = r.pts;
  if (pts.length < 2 && op !== 'shift') return { error: 'Le tracé est encore vide.' };
  const start = pts.length ? pts[0][PK] : r.pkStart, end = pts.length ? pts[pts.length - 1][PK] : r.pkStart;
  const len0 = pathLenPts(pts);
  let removed = [], shifted = 0, delta = 0, join = 0, anchor = null;
  const shiftObs = (lo, hi, d) => {
    for (const o of r.obs) if (o.pk >= lo - 0.5 && o.pk <= hi + 1) { o.pk = r1(o.pk + d); if (o.kind === 'borne') o.ec = r1(o.pk - o.pkB); shifted++; }
  };
  if (op === 'cutStart') {
    if (v1 <= start + 0.5) return { error: 'Indique un PK après le début du tracé (' + fmtPK(start) + ').', soft: true };
    const c = cutAt(pts, v1); if (!c) return { error: 'Ce PK est en dehors du tracé enregistré.' };
    r.pts = dedupe([c.p].concat(pts.slice(c.i + 1)));
    removed = r.obs.filter(o => o.pk < v1 - 0.5);
    r.pkStart = r.pts[0][PK];
  } else if (op === 'cutEnd') {
    if (v1 >= end - 0.5) return { error: 'Indique un PK avant la fin du tracé (' + fmtPK(end) + ').', soft: true };
    const c = cutAt(pts, v1); if (!c) return { error: 'Ce PK est en dehors du tracé enregistré.' };
    r.pts = dedupe(pts.slice(0, c.i + 1).concat([c.p]));
    removed = r.obs.filter(o => o.pk > v1 + 0.5);
  } else if (op === 'section') {
    if (v2 <= v1 + 0.5) return { error: 'Le second PK doit être après le premier.', soft: v2 === v1 };
    const ca = cutAt(pts, v1), cb = cutAt(pts, v2);
    if (!ca || !cb) return { error: 'Les deux PK doivent se trouver sur le tracé enregistré.' };
    if (cb.i < ca.i || (cb.i === ca.i && cb.t <= ca.t)) return { error: 'Les deux PK doivent suivre le sens du chaînage.' };
    const before = pts.slice(0, ca.i + 1).concat([ca.p]);
    const after = [cb.p].concat(pts.slice(cb.i + 1));
    join = segLen(ca.p, cb.p);
    delta = r1(v1 + join - v2);
    const all = before.concat(after);
    const rg = shiftPts(all, before.length, delta);
    if (isFinite(rg.hi)) anchor = rg.hi;
    removed = r.obs.filter(o => o.pk > v1 + 0.5 && o.pk < v2 - 0.5);
    r.obs = r.obs.filter(o => !removed.includes(o));
    shiftObs(v2, rg.hi, delta);
    r.pts = dedupe(all);
  } else if (op === 'shift') {
    delta = r1(v1 - start);
    if (Math.abs(delta) < 0.5) return { error: 'Le tracé part déjà du PK ' + fmtPK(start) + '.', soft: true };
    let hi = Infinity;
    if (pts.length) hi = shiftPts(pts, 0, delta).hi;
    if (isFinite(hi)) anchor = hi;
    shiftObs(-Infinity, hi, delta);
    r.pkStart = r1(v1);
  } else if (op === 'reverse') {
    const rev = pts.slice().reverse();
    let acc = v1;
    rev[0][PK] = r1(v1);
    for (let k = 1; k < rev.length; k++) { acc += segLen(rev[k - 1], rev[k]); rev[k][PK] = r1(acc); }
    for (const o of r.obs) {
      o.pk = hasPos(o) ? r1(project(rev, o.lat, o.lon).pk) : r1(v1 + (end - o.pk));
      if (o.cote === 'G') o.cote = 'D'; else if (o.cote === 'D') o.cote = 'G';
      if (o.kind === 'borne') { o.ec = r1(o.pk - o.pkB); o.recale = false; }
    }
    r.pts = rev; r.pkStart = r1(v1);
  } else return { error: 'Correction inconnue.' };
  if (removed.length) r.obs = r.obs.filter(o => !removed.includes(o));
  if (op !== 'shift' && r.pts.length < 2) return { error: 'Il ne resterait presque rien du tracé.' };
  return {
    r, removed: removed.length, shifted, delta, join, anchor, cut: Math.max(0, len0 - pathLenPts(r.pts) + join),
    start1: r.pts.length ? r.pts[0][PK] : r.pkStart, end1: r.pts.length ? r.pts[r.pts.length - 1][PK] : r.pkStart
  };
}

/* Recale après coup le chaînage sur une borne : la suite du tracé repart du PK inscrit (modifie `r`). */
function recalAt(r, o) {
  const c = cutAt(r.pts, o.pk); if (!c) return 'La position de la borne est en dehors du tracé.';
  const p1 = c.p, p2 = c.p.slice();
  const pts = r.pts.slice(0, c.i + 1).concat([p1, p2], r.pts.slice(c.i + 1));
  const delta = r1(o.pkB - o.pk);
  const rg = shiftPts(pts, c.i + 2, delta);
  for (const x of r.obs) if (x !== o && x.pk > o.pk + 0.5 && x.pk <= rg.hi + 1) { x.pk = r1(x.pk + delta); if (x.kind === 'borne') x.ec = r1(x.pk - x.pkB); }
  r.pts = dedupe(pts); o.recale = true;
  return null;
}
/* Retire le recalage fait sur une borne : la suite du tracé reprend le PK GPS (modifie `r`). */
function unrecal(r, o) {
  const pts = r.pts; let best = -1, bd = Infinity;
  for (let k = 0; k < pts.length - 1; k++) if (isJump(pts[k], pts[k + 1])) { const d = Math.abs(pts[k + 1][PK] - o.pkB); if (d < bd) { bd = d; best = k; } }
  o.recale = false;
  if (best < 0 || bd > 2) return 'Recalage introuvable sur le tracé.';
  const a = pts[best], b = pts[best + 1];
  const excess = r1((b[PK] - a[PK]) - segLen(a, b));
  const idx = x => hasPos(x) ? project(pts, x.lat, x.lon).i : ((pkToPos(pts, x.pk) || { i: -1 }).i);
  const after = r.obs.filter(x => x !== o && idx(x) >= best + 1);
  const rg = shiftPts(pts, best + 1, -excess);
  for (const x of after) if (x.pk <= rg.hi + 1) { x.pk = r1(x.pk - excess); if (x.kind === 'borne') x.ec = r1(x.pk - x.pkB); }
  r.pts = dedupe(pts);
  return null;
}
/*GEO-END*/

/* ---------- Référentiels ---------- */
const KEY = 'pkterrain.v1', UKEY = 'pkterrain.undo';
const DEF = { maxAcc: 20, minStep: 5, sim: false };
const TYPES = ['Nid-de-poule', 'Ravinement', 'Bourbier', 'Tôle ondulée', 'Défaut de profil', 'Compactage', 'Assainissement / fossé', 'Ouvrage (buse, dalot)', 'Autre'];
const COTES = { G: 'Gauche', A: 'Axe', D: 'Droite', GD: 'Les deux côtés' };
const GRAV = { 1: 'Mineure', 2: 'Moyenne', 3: 'Grave' };
const GCLS = { 1: 'ok', 2: 'warn', 3: 'bad' };
const OTYPES = ['Buse Ø800', 'Buse Ø1000', '2 buses Ø800', '2 buses Ø1000', '3 buses Ø1000', 'Dalot', 'Radier', 'Point de coupure', 'Autre'];
const OTRAV = ['Neuf', 'Réhabilitation', 'Allongement', 'Curage'];
const OETAT = { prevu: 'Prévu', cours: 'En cours', fini: 'Terminé', recu: 'Réceptionné' };
const OECLS = { prevu: 'neu', cours: 'warn', fini: 'ok', recu: 'ok' };
const ITYPES = ['Réhabilitation', 'Entretien'];
const MAXPH = 6;

const emptyRef = () => ({ profile: {}, mission: {}, companies: [], markets: [], postes: [], structures: [] });
const blankDb = () => ({ routes: [], ref: emptyRef(), settings: Object.assign({}, DEF), active: null, lastBackup: null, migratedAt: null });
let db = blankDb();
let undo = null;

function normRoute(r) {
  if (!Array.isArray(r.obs)) r.obs = [];
  if (!Array.isArray(r.pts)) r.pts = [];
  if (r.pkStart == null) r.pkStart = r.pts.length ? r.pts[0][PK] : 0;
  if (!r.name) r.name = 'Itinéraire';
  for (const o of r.obs) {
    if (!o.src) o.src = 'gps';
    if (o.kind === 'borne' && o.note == null) o.note = '';
    if (!Array.isArray(o.photos)) o.photos = [];
    if (o.kind === 'obs') { if (!o.statut) o.statut = 'ouvert'; if (!Array.isArray(o.photosApres)) o.photosApres = []; }
  }
  return r;
}
function normalize(d) {
  d.settings = Object.assign({}, DEF, d.settings || {});
  const ref = Object.assign(emptyRef(), d.ref || {});
  for (const k of ['companies', 'markets', 'postes', 'structures']) if (!Array.isArray(ref[k])) ref[k] = [];
  if (!ref.profile || typeof ref.profile !== 'object') ref.profile = {};
  if (!ref.mission || typeof ref.mission !== 'object') ref.mission = {};
  d.ref = ref;
  d.routes = (Array.isArray(d.routes) ? d.routes : []).filter(r => r && r.id).map(normRoute);
  return d;
}
function readLS() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.routes)) return s; } catch (e) { }
  return null;
}

/* ---------- Stockage : base interne du navigateur (IndexedDB), repli sur le stockage simple ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('indisponible'));
    let q; try { q = indexedDB.open('pkterrain', 1); } catch (e) { return rej(e); }
    q.onupgradeneeded = () => {
      const d = q.result;
      if (!d.objectStoreNames.contains('routes')) d.createObjectStore('routes', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
    };
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
    q.onblocked = () => rej(new Error('bloqué'));
  });
}
const idbReq = q => new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const metaDoc = () => ({ v: 3, ref: db.ref, settings: db.settings, active: db.active, lastBackup: db.lastBackup, migratedAt: db.migratedAt });

const Store = {
  mode: 'ls', idb: null, dirty: new Set(), gone: new Set(), timer: null, persisted: null, failed: false,

        : `<button class="btn danger span2" data-act="stop">Arrêter le repérage</button>`}
    </div>`;
    if (live.mode === 'loc') h += `<div id="near"></div>`;
    h += `<div class="sketch"><div id="sketch">${sketchSVG(r, { here: liveHere(r) })}</div>${LEGEND}</div>`;
    h += live.mode === 'rec'
      ? `<p class="note">Mets en pause quand tu descends du véhicule pour marcher : les allers-retours autour d’un point s’ajouteraient au PK. Garde l’écran allumé, l’iPhone coupe le GPS des applis web quand il se verrouille.</p>`
      : `<p class="note">Le PK est calculé en ramenant ta position sur le tracé enregistré. Garde l’écran allumé pendant le repérage.</p>`;
  } else {
    const nObs = r.obs.filter(o => o.kind === 'obs').length;
    h += `<dl class="stats">
      <div class="stat"><dt>Longueur</dt><dd>${fmtDist(pathLen(r))}</dd></div>
      <div class="stat"><dt>${r.longueurKm ? 'Prévu' : 'Points GPS'}</dt><dd>${r.longueurKm ? fmtKm(r.longueurKm) : nf0.format(n)}</dd></div>
      <div class="stat"><dt>Constats</dt><dd>${nObs}</dd></div>
      <div class="stat"><dt>Ouvrages</dt><dd>${ouvsOf(r).length}</dd></div></dl>`;
    if (live.mode) h += `<p class="alert info">Une autre session est en cours. La démarrer ici arrêtera la précédente.</p>`;
    h += n >= 2
      ? `<div class="grid2"><button class="btn span2" data-act="loc">${ICON.pin}Se repérer sur l’itinéraire</button><button class="btn ghost span2" data-act="rec">Continuer l’enregistrement depuis PK ${fmtPK(lastPk(r))}</button></div>`
      : `<button class="btn red" data-act="rec">${ICON.rec}Démarrer au PK ${fmtPK(lastPk(r))}</button>${!n ? '<p class="note">Place-toi au début de l’itinéraire avant de démarrer. Le PK de départ se change dans l’onglet « Plus ».</p>' : ''}`;
    h += `<div class="sketch"><div id="sketch">${sketchSVG(r)}</div>${n >= 2 ? LEGEND : ''}</div>`;
    if (n >= 2) h += `<button class="btn ghost" data-act="trackEdit">${ICON.edit}Corriger le tracé</button><p class="note">Couper le début ou la fin, supprimer un détour, changer le PK de départ ou inverser le sens du chaînage.</p>`;
  }
  return h;
}

function updateLive() {
  if (!live.mode || ui.view !== 'route' || ui.tab !== 'terrain' || live.routeId !== ui.routeId) return;
  const r = getRoute(live.routeId); if (!r || !$('#pkv')) return;
  const f = live.fix, S = db.settings;
  if (live.mode === 'rec') live.pk = recPk(r);
  $('#pkv').textContent = fmtPK(live.pk);
  let sub = '', cls = '';
  if (live.mode === 'rec') {
    if (!r.pts.length) sub = 'En attente d’un point GPS précis pour fixer le PK ' + fmtPK(r.pkStart);
    else { const nx = Math.floor(live.pk / 100 + 1e-9) * 100 + 100; sub = 'Prochain hectomètre PK ' + fmtPK(nx) + ' dans ' + nf0.format(nx - live.pk) + ' m'; }
  } else {
    const p = live.proj;
    if (!f) sub = 'Recherche du signal GPS…';
    else if (!p) sub = 'Tracé trop court pour se repérer';
    else if (p.edge === 'start' && p.off > 15) { sub = 'Avant le début du tracé, à ' + fmtDist(p.off); cls = 'warn'; }
    else if (p.edge === 'end' && p.off > 15) { sub = 'Au-delà de la fin du tracé, à ' + fmtDist(p.off); cls = 'warn'; }
    else if (p.off > 60) { sub = 'Hors itinéraire : à ' + fmtDist(p.off) + ' du tracé'; cls = 'warn'; }
    else if (p.off < 2.5) sub = 'Sur l’axe du tracé';
    else sub = 'À ' + nf0.format(p.off) + ' m de l’axe, côté ' + (p.side === 'G' ? 'gauche' : 'droit');
  }
  const se = $('#pksub'); se.textContent = sub; se.className = 'borne-sub ' + cls;
  $('#status').className = 'status ' + (live.paused ? 'pause' : live.mode);
  $('#status-t').textContent = live.mode === 'loc' ? 'Repérage' : live.paused ? 'En pause' : 'Enregistrement';
  const q = !f ? '' : f.acc <= 10 ? 'ok' : f.acc <= S.maxAcc ? 'warn' : 'bad';
  $('#st-0').innerHTML = f ? `<i class="q ${q}"></i>±${nf0.format(f.acc)} m` : '—';
  $('#st-1').textContent = f && f.spd != null ? nf0.format(f.spd * 3.6) + ' km/h' : '—';
  if (live.mode === 'rec') {
    $('#st-2').textContent = fmtDist(Math.max(0, pathLen(r) - live.startLen));
    $('#st-3').textContent = fmtDur(Date.now() - live.startedAt);
  } else {
    $('#st-2').textContent = live.proj ? nf0.format(live.proj.off) + ' m' : '—';
    $('#st-3').textContent = fmtPK(lastPk(r));
  }
  const al = [];
  if (live.err) al.push(['bad', live.err]);
  else if (!f) al.push(['info', 'Recherche du signal GPS… Reste à découvert, à l’écart des arbres et des bâtiments.']);
  else if (live.mode === 'rec' && f.acc > S.maxAcc) al.push(['warn', 'Signal imprécis (±' + nf0.format(f.acc) + ' m). Les points sont ignorés tant que la précision dépasse ±' + S.maxAcc + ' m.']);
  else if (live.mode === 'loc' && f.acc > 30) al.push(['warn', 'Signal imprécis (±' + nf0.format(f.acc) + ' m) : le PK affiché peut être décalé.']);
  if (live.gap && Date.now() - live.gap.at < 120000) al.push(['warn', 'Coupure GPS de ' + fmtDur(live.gap.dt * 1000) + ' : ' + fmtDist(live.gap.d) + ' comptés en ligne droite. Contrôle au prochain repère.']);
  if (live.paused) al.push(['info', 'En pause : le PK ne bouge plus. Reprends quand tu remontes dans le véhicule.']);
  if (S.sim) al.push(['info', 'Mode test : la position est simulée.']);
  const ah = al.map(([c, t]) => `<p class="alert ${c}">${esc(t)}</p>`).join(''), ae = $('#alerts');
  if (ae._h !== ah) { ae.innerHTML = ah; ae._h = ah; }
  const bp = $('#b-pause'); if (bp) bp.textContent = live.paused ? 'Reprendre' : 'Pause';
  const nr = $('#near'); if (nr) { const nh = live.pk != null ? nearHTML(r, live.pk) : ''; if (nr._h !== nh) { nr.innerHTML = nh; nr._h = nh; hydratePhotos(nr); } }
  if (Date.now() - live.lastSketch > 2500) { $('#sketch').innerHTML = sketchSVG(r, { here: liveHere(r) }); $('#route-sub').textContent = routeSub(r); live.lastSketch = Date.now(); }
}

const phCount = o => { const n = (o.photos || []).length + (o.photosApres || []).length; return n ? plural(n, 'photo', 'photos') : ''; };
const isOpen = o => o.kind === 'obs' && o.statut !== 'leve';
const isDone = o => o.kind === 'obs' && o.statut === 'leve';
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fmtShort = iso => { const d = new Date(iso + 'T12:00:00'); if (isNaN(d)) return iso; const o = { day: 'numeric', month: 'short' }; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('fr-FR', o); };
const ageTxt = t => { const d = daysAgo(t || Date.now()); return d <= 0 ? 'depuis aujourd’hui' : 'depuis ' + d + ' j'; };
const statusPill = o => o.statut === 'leve' ? `<span class="pill ok">Corrigé${o.dateLevee ? ' le ' + esc(fmtShort(o.dateLevee)) : ''}</span>` : `<span class="pill neu">À corriger · ${ageTxt(o.t)}</span>`;
function obsRow(o, delta) {
  const d = delta != null ? `<small>${fmtSigned(delta)}</small>` : '';
  const manual = o.src === 'manuel' ? 'saisi après coup' : '';
  const nopos = hasPos(o) ? '' : 'sans coordonnées';
  const thid = (o.statut === 'leve' && o.photosApres && o.photosApres[0]) || (o.photos && o.photos[0]);
  const th = thid ? `<span class="othumb"><img data-photo="${thid}" alt=""></span>` : '';
  if (o.kind === 'borne') {
    const meta = ['PK GPS ' + fmtPK(o.pk), o.recale ? 'chaînage recalé ici' : '', manual, nopos, phCount(o)].filter(Boolean).join(' · ');
    return `<button class="orow" data-act="editObs" data-arg="${o.id}"><span class="opk">${fmtPK(o.pkB)}${d}</span><span><span class="otop"><span class="otype">Borne</span><span class="pill ${ecCls(o.ec)}">Écart ${fmtSigned(o.ec)}</span></span><span class="ometa">${esc(meta)}</span>${o.note ? `<span class="onote">${esc(o.note)}</span>` : ''}</span>${th}</button>`;
  }
  const meta = [COTES[o.cote] || '', o.len ? 'sur ' + nf0.format(o.len) + ' m' : '', manual, nopos, phCount(o)].filter(Boolean).join(' · ');
  return `<button class="orow" data-act="editObs" data-arg="${o.id}"><span class="opk">${fmtPK(o.pk)}${d}</span><span><span class="otop"><span class="otype">${esc(o.type)}</span><span class="pill ${GCLS[o.grav]}">${GRAV[o.grav]}</span>${statusPill(o)}</span><span class="ometa">${esc(meta)}</span>${o.note ? `<span class="onote">${esc(o.note)}</span>` : ''}${o.statut === 'leve' && o.noteLevee ? `<span class="onote done">Levée : ${esc(o.noteLevee)}</span>` : ''}</span>${th}</button>`;
}
function ouvRow(s, delta) {
  const d = delta != null ? `<small>${fmtSigned(delta)}</small>` : '';
  const meta = [s.dims, s.travaux, hasPos(s) ? '' : 'sans coordonnées'].filter(Boolean).join(' · ');
  return `<button class="orow" data-act="editOuv" data-arg="${s.id}"><span class="opk">${s.pk != null ? fmtPK(s.pk) : '—'}${d}</span><span><span class="otop"><span class="otype">${esc(s.code ? s.code + ' · ' : '')}${esc(s.type || 'Ouvrage')}</span><span class="pill ${OECLS[s.etat] || 'neu'}">${OETAT[s.etat] || 'Prévu'}</span></span><span class="ometa">${esc(meta)}</span>${s.note ? `<span class="onote">${esc(s.note)}</span>` : ''}</span></button>`;
}
function nearHTML(r, pk) {
  const list = r.obs.map(o => ({ o, d: obsPk(o) - pk, k: 'o' })).concat(ouvsOf(r).filter(s => s.pk != null).map(s => ({ o: s, d: s.pk - pk, k: 's' })))
    .filter(x => Math.abs(x.d) <= 300).sort((a, b) => Math.abs(a.d) - Math.abs(b.d)).slice(0, 5);
  if (!list.length) return '';
  return `<h3 class="h3">À moins de 300 m</h3>${list.some(x => x.k === 'o' && isOpen(x.o)) ? '<p class="note">Touche un constat pour indiquer s’il est corrigé.</p>' : ''}<ul class="olist">${list.map(x => `<li>${x.k === 's' ? ouvRow(x.o, x.d) : obsRow(x.o, x.d)}</li>`).join('')}</ul>`;
}

function obsHTML(r) {
  const list = [...r.obs].sort((a, b) => obsPk(a) - obsPk(b));
  const bor = list.filter(o => o.kind === 'borne'), open = list.filter(isOpen), done = list.filter(isDone);
  const add = `<div class="grid2"><button class="btn ghost" data-act="addObs">${ICON.plus}Constat</button><button class="btn ghost" data-act="addBorne">${ICON.plus}Borne</button></div>`;
  if (!list.length) return `<section class="card"><h3>Aucun constat</h3><p>Sur le terrain, touche « Constat » ou « Contrôle borne » pendant l’enregistrement ou le repérage. Tu peux aussi en ajouter ici à n’importe quel PK du tracé, même après coup.</p>${add}</section>`;
  const f = ui.obsFilter || 'all';
  const FL = [['all', 'Tout', list.length], ['open', 'À corriger', open.length], ['done', 'Corrigés', done.length]].concat(bor.length ? [['bornes', 'Bornes', bor.length]] : []);
  const shown = f === 'open' ? open : f === 'done' ? done : f === 'bornes' ? bor : list;
  const g3 = open.filter(o => o.grav == 3).length;
  const worst = bor.length ? bor.reduce((m, o) => Math.abs(o.ec) > Math.abs(m.ec) ? o : m) : null;
  const oldest = open.length ? open.reduce((m, o) => (o.t || 0) < (m.t || 0) ? o : m) : null;
  let h = add;
  h += `<div class="summary"><span class="pill ${open.length ? 'warn' : 'ok'}">${open.length} à corriger${g3 ? ' dont ' + plural(g3, 'grave', 'graves') : ''}</span><span class="pill ok">${plural(done.length, 'corrigé', 'corrigés')}</span>${worst ? `<span class="pill ${ecCls(worst.ec)}">Écart max. bornes ${fmtSigned(worst.ec)}</span>` : ''}</div>`;
  if (oldest && daysAgo(oldest.t) >= 1) h += `<p class="note">Le plus ancien constat à corriger est au PK ${fmtPK(oldest.pk)}, noté il y a ${plural(daysAgo(oldest.t), 'jour', 'jours')}.</p>`;
  h += `<div class="chips">${FL.map(([k, l, n]) => `<button class="chip" data-act="obsf" data-arg="${k}" aria-pressed="${f === k}">${l} · ${n}</button>`).join('')}</div>`;
  h += shown.length ? `<ul class="olist">${shown.map(o => `<li>${obsRow(o)}</li>`).join('')}</ul>` : `<p class="note">Aucun constat dans ce filtre.</p>`;
  h += `<p class="note">Touche un constat pour le marquer corrigé, le modifier ou le supprimer.</p>`;
  h += `<button class="btn ghost" data-act="export" data-arg="obs">${ICON.share}Partager les constats (CSV)</button>`;
  return h;
}
function ouvHTML(r) {
  const list = ouvsOf(r);
  const add = `<button class="btn ghost" data-act="addOuv">${ICON.plus}Ouvrage</button>`;
  if (!list.length) return `<section class="card"><h3>Aucun ouvrage</h3><p>Ajoute les buses, dalots, radiers et points de coupure de cet itinéraire, avec leur PK. Ils apparaîtront sur le croquis et pendant le repérage, à l’approche.</p>${add}</section>`;
  const cnt = k => list.filter(s => (s.etat || 'prevu') === k).length;
  let h = add + `<div class="summary">${Object.entries(OETAT).map(([k, v]) => cnt(k) ? `<span class="pill ${OECLS[k]}">${cnt(k)} ${v.toLowerCase()}${cnt(k) > 1 && k !== 'cours' ? 's' : ''}</span>` : '').join('')}</div>`;
  h += `<ul class="olist">${list.map(s => `<li>${ouvRow(s)}</li>`).join('')}</ul><p class="note">Touche une ligne pour la modifier ou la supprimer.</p>`;
  return h;
}

function tableHTML(r) {
  if (r.pts.length < 2) return `<section class="card"><h3>Pas encore de tracé</h3><p>Le tableau des PK et de leurs coordonnées se remplit dès que l’itinéraire est enregistré.</p></section>`;
  const rows = pkTable(r.pts, ui.step);
  const z = toUTM(r.pts[0][LAT], r.pts[0][LON]);
  const steps = [25, 50, 100, 200, 500];
  let h = `<div class="field"><span class="lbl">Intervalle</span><div class="chips">${steps.map(s => `<button class="chip" aria-pressed="${ui.step === s}" data-act="step" data-arg="${s}">${s} m</button>`).join('')}</div></div>`;
  h += `<div class="field"><span class="lbl">Coordonnées</span><div class="chips"><button class="chip" aria-pressed="${ui.coord === 'utm'}" data-act="coord" data-arg="utm">UTM ${z.zone}${z.hemi} (m)</button><button class="chip" aria-pressed="${ui.coord === 'deg'}" data-act="coord" data-arg="deg">Degrés WGS 84</button></div></div>`;
  const thead = ui.coord === 'utm' ? '<th>PK</th><th>X (Est)</th><th>Y (Nord)</th>' : '<th>PK</th><th>Latitude</th><th>Longitude</th>';
  const body = rows.map(p => {
    const c = ui.coord === 'utm' ? (u => [nf2.format(u.x), nf2.format(u.y)])(toUTM(p.lat, p.lon, z.zone)) : [nf6.format(p.lat), nf6.format(p.lon)];
    return `<tr class="${p.edge ? 'edge' : ''}"><td>${fmtPK(p.pk)}${p.edge ? ' <small>' + p.edge + '</small>' : ''}</td><td>${c[0]}</td><td>${c[1]}</td></tr>`;
  }).join('');
  h += `<div class="twrap"><table><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table></div>`;
  h += `<p class="note">${rows.length} lignes · UTM WGS 84 zone ${z.zone}${z.hemi}. Positions interpolées sur le tracé GPS (précision de l’ordre de ±5 m) : à confirmer au levé topographique pour une implantation.</p>`;
  h += `<button class="btn ghost" data-act="export" data-arg="table">${ICON.share}Partager le tableau (CSV)</button>`;
  return h;
}

function toast(text, cls, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(text)}</span>` + (action ? `<button class="toast-btn" type="button">${esc(action.label)}</button>` : '');
  el.className = 'toast show ' + (cls || '') + (action ? ' has-act' : '');
  if (action) el.querySelector('.toast-btn').onclick = () => { el.className = 'toast'; action.fn(); };

}
const undoToast = text => toast(text, null, { label: 'Annuler', fn: doUndo });

/* ---------- Feuilles ---------- */
function openSheet(html) {
  pickFrame = null;
  $('#sheet-body').innerHTML = html; $('#sheet').hidden = false;
  const ps = $('#pick-svg'); if (ps) ps.addEventListener('click', onPick);
  hydratePhotos($('#sheet-body'));

}
function closeSheet() { $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; ui.form = null; pickFrame = null; }
const head = t => `<div class="sh-head"><h2>${t}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Fermer">${ICON.close}</button></div>`;
function pkInput(p, m) {
  const v = Math.round(Math.max(0, m || 0)), km = Math.floor(v / 1000), r = v % 1000;
  return `<div class="pkin"><span aria-hidden="true">PK</span><input id="${p}-km" type="number" inputmode="numeric" min="0" step="1" value="${km}" aria-label="Kilomètres"><span aria-hidden="true">+</span><input id="${p}-m" type="number" inputmode="numeric" min="0" max="999" step="1" value="${String(r).padStart(3, '0')}" aria-label="Mètres"></div>`;
}
const fieldPK = (p, label, val, hint, hintId) => `<div class="field"><span class="lbl">${label}</span>${pkInput(p, val)}${hint != null ? `<span class="hint"${hintId ? ` id="${hintId}"` : ''}>${hint}</span>` : ''}</div>`;
const fieldText = (id, label, val, ph, opts) => `<div class="field"><label class="lbl" for="${id}">${label}</label><input id="${id}" type="${(opts && opts.type) || 'text'}"${opts && opts.mode ? ` inputmode="${opts.mode}"` : ''}${opts && opts.focus ? ' data-focus="1"' : ''} autocomplete="off" value="${esc(val ?? '')}" placeholder="${esc(ph || '')}"></div>`;
const fieldArea = (id, label, val, ph, rows) => `<div class="field"><label class="lbl" for="${id}">${label}</label><textarea id="${id}" rows="${rows || 3}" placeholder="${esc(ph || '')}">${esc(val ?? '')}</textarea></div>`;
const val = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
function readPK(p) {
  const km = parseInt($('#' + p + '-km').value, 10) || 0;
  const m = Math.min(999, Math.max(0, parseFloat(String($('#' + p + '-m').value).replace(',', '.')) || 0));
  return km * 1000 + m;
}
function setPK(p, v) {
  v = Math.round(Math.max(0, v));
  const k = $('#' + p + '-km'), m = $('#' + p + '-m'); if (!k || !m) return;
  k.value = Math.floor(v / 1000); m.value = String(v % 1000).padStart(3, '0');
}
const chip = (g, v, l, on) => `<button class="chip" data-act="pick" data-group="${g}" data-arg="${esc(v)}" aria-pressed="${!!on}">${esc(l)}</button>`;
function utmLine(lat, lon, acc) { const u = toUTM(lat, lon); return `X ${nf0.format(u.x)} · Y ${nf0.format(u.y)} (UTM ${u.zone}${u.hemi})${acc ? ' · ±' + nf0.format(acc) + ' m' : ''}`; }
const coordLine = o => hasPos(o) ? utmLine(o.lat, o.lon, o.acc) : 'Sans coordonnées';
function posLine(r, pk) {
  if (r.pts.length < 2) return { t: 'Pas encore de tracé : ce point sera noté sans coordonnées.', warn: true };

    const F = ui.form, r = getRoute(ui.routeId); if (!F || !r) return;
    if (isLiveOn(r)) return toast('Arrête la session en cours pour corriger le tracé.', 'warn');
    if (F.op === 'clear') {
      const withObs = !!($('#t-obs') && $('#t-obs').checked);
      remember('tracé de ' + (r.code || r.name) + ' effacé', { routes: [r] });
      r.pkStart = firstPk(r); r.pts = []; if (withObs) r.obs = [];
      if (db.active && db.active.routeId === r.id) db.active = null;
      commitRoute(r); closeSheet(); ui.tab = 'terrain'; render(); return undoToast('Tracé effacé');
    }
    const v1 = readPK('t1'), v2 = F.op === 'section' ? readPK('t2') : null;
    const res = trackOp(r, F.op, v1, v2);
    if (res.error) return toast(res.error, 'warn');
    const label = { cutStart: 'début coupé au PK ' + fmtPK(v1), cutEnd: 'fin coupée au PK ' + fmtPK(v1), section: 'tronçon PK ' + fmtPK(v1) + ' → ' + fmtPK(v2) + ' supprimé', shift: 'PK de départ changé en ' + fmtPK(v1), reverse: 'sens du chaînage inversé' }[F.op];
    remember(label, { routes: [r] });
    commitRoute(normRoute(res.r)); closeSheet(); render(); undoToast('Tracé corrigé : ' + label);
  },
  undo() { doUndo(); },
  step(v) { ui.step = +v; render(); },
  coord(v) { ui.coord = v; render(); },
  export(kind) { const r = getRoute(ui.routeId); if (r) doExport(kind, r); },
  backup(v) { doBackup(v === '1'); },
  import() { $('#imp').value = ''; $('#imp').click(); },
  delRoute(_, b) {
    if (!arm(b, 'Confirmer la suppression')) return;
    const r = getRoute(ui.routeId); if (!r) return;
    if (live.routeId === r.id) stopLive(false);
    const c = routeComp(r);
    remember('itinéraire « ' + routeTitle(r) + ' » supprimé', { routes: [r], deleted: true });
    dropRoute(r.id); save(true);
    if (c) { ui.view = 'company'; ui.companyId = c.id; } else ui.view = 'home';
    render(); undoToast('Itinéraire supprimé');
  },
  closeSheet() { closeSheet(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { if (b.disabled) return; const f = A[b.dataset.act]; if (f) f(b.dataset.arg, b, e); return; }
  if (e.target.id === 'sheet') closeSheet();
  if (e.target.id === 'viewer') A.closeViewer();
});
$('#sheet-body').addEventListener('input', () => sheetSync());
$('#sheet-body').addEventListener('change', e => {
  const id = e.target.id || '';
  if (id.startsWith('ph-in-')) { const f = e.target.files && e.target.files[0]; if (f) addPhoto(f, id.slice(6)); e.target.value = ''; }
  else if (id === 't-obs') sheetSync();
});
$('#sheet-body').addEventListener('focusin', e => {
  const m = /^(\w+)-(km|m)$/.exec(e.target.id || ''), F = ui.form;
  if (m && F && F.pick && F.pick.includes(m[1]) && F.pickT !== m[1]) { F.pickT = m[1]; sheetSync(); }
});
$('#imp').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => importFile(String(rd.result)); rd.readAsText(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#viewer').hidden) A.closeViewer(); else if (!$('#sheet').hidden) closeSheet(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') save(true);
  else {
    if (live.mode) { keepAwake(); updateLive(); }
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(g => g && g.update()).catch(() => { });
  }
});
addEventListener('pagehide', () => save(true));
setInterval(() => { if (live.mode) updateLive(); }, 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => { });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl) return;
    if (live.mode) { toast('Nouvelle version prête : elle s’ouvrira au prochain lancement.'); return; }
    save(true).then(() => location.reload());
  });
}
(async () => {
  await Store.init();
  render();
  askPersist();
  setTimeout(gcPhotos, 8000);
})();
</script>
</body>
</html>
